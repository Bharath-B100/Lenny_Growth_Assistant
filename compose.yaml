name: lenny-growth-assistant
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_local}
      POSTGRES_DB: lenny
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 5s
      retries: 12
  ollama:
    image: ollama/ollama:0.40.1
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      ollama:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://lenny:${POSTGRES_PASSWORD:-lenny_local}@db:5432/lenny
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AGENT_BRIDGE_URL: http://agent:8787
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-900}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    volumes:
      - ./data/transcripts:/app/data/transcripts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_started
volumes:
  postgres-data:
  ollama-data:

